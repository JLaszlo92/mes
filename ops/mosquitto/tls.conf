# Reference copy of /etc/mosquitto/conf.d/tls.conf on node-dc (no secrets).
# Single listener: mutual TLS. Clients need a certificate from the device CA
# (ops/ca/mes-ca.sh issue-device); the certificate CN is the MQTT user name
# and /etc/mosquitto/acl.conf decides what that user may do.
# Do NOT combine "require_certificate false" with "use_identity_as_username
# true": the broker then refuses every client.
per_listener_settings true

listener 8884
cafile /etc/mosquitto/certs/device-ca.crt
certfile /etc/mosquitto/certs/cert.pem
keyfile  /etc/mosquitto/certs/key.pem
tls_version tlsv1.2
require_certificate true
use_identity_as_username true
allow_anonymous false
acl_file /etc/mosquitto/acl.conf
