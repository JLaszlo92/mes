# Reference copy of /etc/mosquitto/acl.conf on node-dc (owner root:mosquitto, 0640).
# The user name is the CN of the device certificate. A valid certificate
# without a block here connects but can publish and receive nothing.
# Adding or removing a device: edit this file, then systemctl reload mosquitto.
user backend
topic read mes/machines/+/events
topic write mes/machines/+/acks

user node-gate
topic write mes/machines/+/events
topic read mes/machines/+/acks

user admin-laptop
topic read mes/#
topic read $SYS/#
