# MES reverse proxy (node-dc). Install as /etc/nginx/sites-available/mes
# and symlink into sites-enabled (remove the default site).
#
# 443: TLS with the internal-CA "proxy" certificate
#   /api/*, /health  -> backend 127.0.0.1:3001
#   /ws              -> backend WebSocket (single-use ticket auth stays in the backend)
#   everything else  -> static frontend build in /var/www/mes (SPA fallback,
#                       so deep links like /production/schedule work)
# 80: redirect to https.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    server_name mes.pilot.internal 192.168.60.141;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:5m;
    ssl_session_timeout 1h;

    server_tokens off;
    client_max_body_size 25m;

    # Backend (the backend sees the real client IP via X-Forwarded-For;
    # set Fastify trustProxy before relying on it - login limits key on the IP).
    location /api/ {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:3001;
        proxy_set_header Host $host;
    }

    location = /ws {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;   # the backend closes sockets itself after 10 min
    }

    # Static frontend (hashed asset names -> cache hard).
    location /assets/ {
        root /var/www/mes;
        expires 1y;
    }

    # SPA: unknown paths serve index.html (never cached, so a new build is picked up).
    location / {
        root /var/www/mes;
        try_files $uri /index.html;
        expires -1;
    }
}
