<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 480" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
  <style>
    .box { fill: #fcfcfb; stroke: #c3c2b7; stroke-width: 1.5; rx: 10; }
    .title { font-size: 15px; font-weight: 600; fill: #0b0b0b; }
    .sub { font-size: 12px; fill: #52514e; }
    .pin { font-size: 12px; fill: #0b0b0b; }
    .wire-good { stroke: #2a78d6; stroke-width: 2; fill: none; }
    .wire-scrap { stroke: #eb6834; stroke-width: 2; fill: none; }
    .wire-status { stroke: #1baf7a; stroke-width: 2; fill: none; }
    .wire-gnd { stroke: #898781; stroke-width: 2; stroke-dasharray: 5 3; fill: none; }
    .wire-label { font-size: 11px; fill: #52514e; }
    .resistor { fill: #fcfcfb; stroke: #52514e; stroke-width: 1.2; }
    .net-box { fill: #f0efec; stroke: #c3c2b7; stroke-width: 1.5; rx: 8; }
    .svc { font-size: 11.5px; fill: #52514e; }
    .caption { font-size: 12px; fill: #898781; }
  </style>

  <rect x="0" y="0" width="980" height="480" fill="#f9f9f7"/>

  <!-- Pi 1: virtual machine -->
  <rect class="box" x="30" y="70" width="220" height="180" rx="10"/>
  <text class="title" x="45" y="95">Pi #1</text>
  <text class="sub" x="45" y="113">Virtual manufacturing machine</text>
  <text class="pin" x="45" y="145">GPIO17 — good pulse (out)</text>
  <text class="pin" x="45" y="167">GPIO27 — scrap pulse (out)</text>
  <text class="pin" x="45" y="189">GPIO22 — status (out)</text>
  <text class="pin" x="45" y="211">GND</text>
  <text class="sub" x="45" y="236">virtual_machine.py (gpiozero)</text>

  <!-- Pi 2: edge agent -->
  <rect class="box" x="380" y="70" width="220" height="180" rx="10"/>
  <text class="title" x="395" y="95">Pi #2</text>
  <text class="sub" x="395" y="113">Edge agent</text>
  <text class="pin" x="395" y="145">GPIO5 — good pulse (in)</text>
  <text class="pin" x="395" y="167">GPIO6 — scrap pulse (in)</text>
  <text class="pin" x="395" y="189">GPIO13 — status (in)</text>
  <text class="pin" x="395" y="211">GND</text>
  <text class="sub" x="395" y="236">gpio_bridge.py → edge-agent (Node)</text>

  <!-- wires Pi1 -> Pi2, each with an inline resistor -->
  <path class="wire-good" d="M 250 145 H 320"/>
  <rect class="resistor" x="320" y="139" width="30" height="12"/>
  <path class="wire-good" d="M 350 145 H 380"/>
  <text class="wire-label" x="255" y="136">good (330Ω)</text>

  <path class="wire-scrap" d="M 250 167 H 320"/>
  <rect class="resistor" x="320" y="161" width="30" height="12"/>
  <path class="wire-scrap" d="M 350 167 H 380"/>
  <text class="wire-label" x="255" y="180">scrap (330Ω)</text>

  <path class="wire-status" d="M 250 189 H 320"/>
  <rect class="resistor" x="320" y="183" width="30" height="12"/>
  <path class="wire-status" d="M 350 189 H 380"/>
  <text class="wire-label" x="255" y="203">status (330Ω)</text>

  <path class="wire-gnd" d="M 250 211 H 380"/>
  <text class="wire-label" x="255" y="225">GND — common reference (no resistor)</text>

  <!-- Pi 3: backend -->
  <rect class="box" x="730" y="50" width="220" height="220" rx="10"/>
  <text class="title" x="745" y="75">Pi #3</text>
  <text class="sub" x="745" y="93">Backend</text>
  <rect class="net-box" x="745" y="105" width="190" height="34"/>
  <text class="svc" x="755" y="126">PostgreSQL — localhost:5432</text>
  <rect class="net-box" x="745" y="145" width="190" height="34"/>
  <text class="svc" x="755" y="166">Mosquitto (MQTT) — :1883</text>
  <rect class="net-box" x="745" y="185" width="190" height="34"/>
  <text class="svc" x="755" y="206">Backend API/WS — :3001</text>
  <text class="sub" x="745" y="240">runs the @mes/backend package</text>

  <!-- network link Pi2 <-> Pi3 -->
  <path d="M 600 160 H 730" stroke="#c3c2b7" stroke-width="2" fill="none" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text class="wire-label" x="612" y="150">LAN — MQTT (:1883) + HTTP/WS (:3001)</text>

  <!-- laptop for dashboard -->
  <rect class="box" x="730" y="330" width="220" height="90" rx="10"/>
  <text class="title" x="745" y="355">Your laptop</text>
  <text class="sub" x="745" y="373">Dashboard — @mes/frontend</text>
  <text class="sub" x="745" y="391">http://&lt;pi3-ip&gt;:3001 via VITE_BACKEND_WS_URL</text>
  <path d="M 840 330 V 270" stroke="#c3c2b7" stroke-width="2" fill="none" marker-end="url(#arrow)"/>

  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="4" refY="4" orient="auto">
      <circle cx="4" cy="4" r="2.5" fill="#898781"/>
    </marker>
  </defs>

  <text class="caption" x="30" y="290">All GPIO pins are BCM numbers. Only signal lines (good/scrap/status) get the 330Ω series resistor — GND is a direct wire.</text>
  <text class="caption" x="30" y="308">Physical header pins: GPIO17=11, GPIO27=13, GPIO22=15 (Pi #1) · GPIO5=29, GPIO6=31, GPIO13=33 (Pi #2) · GND=any pin marked GND on either board.</text>
  <text class="caption" x="30" y="326">Inputs on Pi #2 use pull-down resistors: a disconnected wire reads "down", never a false "running".</text>
</svg>
